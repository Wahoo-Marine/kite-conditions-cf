name = "kite-conditions"
account_id = "306c7c1b7819d4aab071bd67cee32229"
compatibility_date = "2024-12-01"
main = "./dist/index.js"
workers_dev = true

[assets]
directory = "./public"

# D1 Database — stores spots + user preferences
[[d1_databases]]
binding = "DB"
database_name = "kite-conditions-db"
database_id = "e334d32d-94ef-4ba2-ae43-3d175b1420f0"

# KV Namespace — caches Open-Meteo forecast responses
[[kv_namespaces]]
binding = "CACHE"
id = "bbe782b255734d20b8e672581f0dfbcf"

# Custom domain (auto-creates DNS record)
[[routes]]
pattern = "kite.wahoomarine.com"
custom_domain = true

[vars]
# Set this to your Cloudflare Access login email to enable admin controls
ADMIN_EMAIL = "chip@wahoomarine.com"
# Audience tag for the CF Access application protecting /settings
CF_ACCESS_AUD = "b480a3d197b1c88a7dcc0b0db44a204d89ae95b32ad690085a9cac379887ad79"
