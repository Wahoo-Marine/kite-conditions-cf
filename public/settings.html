<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪁 Settings — Kite Conditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>

<header>
  <h1>🪁 Kite Conditions</h1>
  <div class="subtitle">Manage your spots</div>
</header>

<nav>
  <a href="/">Dashboard</a>
  <a href="/settings" class="active">Settings</a>
</nav>

<div id="user-bar" class="user-bar"></div>

<div class="container settings-width" id="app">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h2 style="font-size:1.3rem;color:var(--accent);">📍 Your Spots</h2>
    <button class="btn btn-add" id="btn-add-spot">+ Add Spot</button>
  </div>

  <!-- Add / Edit Form (hidden by default) -->
  <div class="spot-form" id="spot-form" style="display:none;">
    <h3 id="form-title">Add New Spot</h3>
    <div class="lookup-row">
      <div class="form-group">
        <label for="geo-input">Search location</label>
        <input type="text" id="geo-input" placeholder="e.g. Lake Allatoona, GA or Dauphin Island, AL">
      </div>
      <button class="btn-lookup" id="btn-geo" type="button">🗺 Pick on Map</button>
    </div>

    <div class="form-row" style="margin-top:0.8rem;">
      <div class="form-group">
        <label for="spot-name">Name</label>
        <input type="text" id="spot-name" placeholder="Spot name">
      </div>
      <div class="form-group">
        <label for="spot-short-slug">Short Name (URL)</label>
        <input type="text" id="spot-short-slug" placeholder="turks">
        <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem;">Creates public URL: <code>/turks</code></div>
      </div>
      <div class="form-group">
        <label for="spot-lat">Latitude</label>
        <input type="number" id="spot-lat" step="any" placeholder="24.5551">
      </div>
      <div class="form-group">
        <label for="spot-lon">Longitude</label>
        <input type="number" id="spot-lon" step="any" placeholder="-81.7800">
      </div>
    </div>

    <div id="webcam-fields"></div>
    <button class="btn btn-edit" id="btn-add-cam" type="button" style="margin-bottom:0.8rem;font-size:.72rem;">+ Add Webcam</button>

    <div class="form-actions">
      <button class="btn btn-save" id="btn-save">Save</button>
      <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
    </div>
    <input type="hidden" id="edit-id" value="">
  </div>

  <!-- Spot List -->
  <div class="spot-list" id="spot-list"></div>
</div>

<!-- Map Picker Modal -->
<div id="map-modal" class="map-modal" style="display:none;" role="dialog" aria-modal="true" aria-label="Pick location on map">
  <div class="map-modal-inner">
    <div class="map-modal-header">
      <div>
        <h3 style="margin:0;font-size:1rem;">📍 Pick Location</h3>
        <p style="margin:0.2rem 0 0;font-size:.78rem;color:var(--text-muted);">Click the map or drag the pin to set the exact spot. Use the search box to jump to a location.</p>
      </div>
      <button class="btn btn-cancel" id="map-close" type="button">✕ Close</button>
    </div>

    <div class="map-search-row">
      <input type="text" id="map-search-input" placeholder="Search again…" autocomplete="off">
      <button class="btn-lookup" id="map-search-btn" type="button">🔍</button>
    </div>
    <div id="map-search-results" class="map-search-results"></div>

    <div id="map-container"></div>

    <div class="map-coords-bar">
      <span>📌 <strong id="map-lat-display">—</strong>, <strong id="map-lon-display">—</strong></span>
      <button class="btn btn-save" id="map-use-btn" type="button" disabled>✓ Use this location</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<footer>
  Powered by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<style>
/* ── User Bar ──────────────────────── */
.user-bar {
  background: rgba(15, 24, 39, 0.6);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--border);
  padding: var(--space-2) var(--space-5);
  font-size: var(--text-xs);
  color: var(--text-muted);
  min-height: 2rem;
}
.user-bar-inner {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  max-width: 780px;
  margin: 0 auto;
}
.view-toggle {
  display: flex;
  gap: var(--space-1);
  margin-left: auto;
  padding: 2px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
}
.view-toggle button {
  padding: var(--space-1) var(--space-3);
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--duration) var(--ease);
  font-family: inherit;
}
.view-toggle button:hover { color: var(--text); }
.view-toggle button.active {
  background: var(--accent-soft);
  color: var(--accent);
}

/* ── Map Modal ──────────────────────── */
.map-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}
.map-modal-inner {
  background:
    var(--card-gradient),
    var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.map-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--hairline);
  gap: var(--space-4);
}
.map-modal-header h3 {
  font-size: var(--text-base);
  font-weight: 700;
  letter-spacing: -0.01em;
}
.map-search-row {
  display: flex;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4) 0;
}
.map-search-row input {
  flex: 1;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: var(--text-sm);
  font-family: inherit;
  transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
}
.map-search-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.map-search-results {
  max-height: 140px;
  overflow-y: auto;
  margin: 0 var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  display: none;
}
.map-search-results .geo-item {
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  border-bottom: 1px solid var(--hairline);
  font-size: var(--text-sm);
  transition: background var(--duration) var(--ease);
}
.map-search-results .geo-item:last-child { border-bottom: none; }
.map-search-results .geo-item:hover { background: var(--card-hover); }
.map-search-results .geo-coords { font-size: var(--text-xs); color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
#map-container {
  flex: 1;
  min-height: 300px;
  margin: var(--space-3) var(--space-4) 0;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
}
.map-coords-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-3) var(--space-4) var(--space-4);
  font-size: var(--text-sm);
  gap: var(--space-3);
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
</style>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let spots = [];
let currentUser = null;
let viewMode = 'mine'; // 'mine' | 'defaults' (admin only)

document.addEventListener('DOMContentLoaded', async () => {
  await loadUser();
  loadSpots();
  bindEvents();
});

// ── Bind Events ───────────────────────
function bindEvents() {
  $('#btn-add-spot').addEventListener('click', () => showForm());
  $('#btn-cancel').addEventListener('click', () => hideForm());
  $('#btn-save').addEventListener('click', () => saveSpot());
  $('#btn-geo').addEventListener('click', () => geoLookup());
  $('#btn-add-cam').addEventListener('click', () => addWebcamField());

  // Enter on geo input
  $('#geo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); geoLookup(); }
  });
}

// ── Load User ──────────────────────
async function loadUser() {
  try {
    const res = await fetch('/api/me');
    currentUser = await res.json();
  } catch (e) {
    currentUser = { email: null, isAdmin: false };
  }
  renderUserBar();
}

function renderUserBar() {
  const bar = $('#user-bar');
  if (!currentUser?.email) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="user-bar-inner">
      <span>👤 ${esc(currentUser.email)}</span>
      ${currentUser.isAdmin ? `
        <div class="view-toggle">
          <button onclick="setViewMode('mine')" class="${viewMode === 'mine' ? 'active' : ''}">My Spots</button>
          <button onclick="setViewMode('defaults')" class="${viewMode === 'defaults' ? 'active' : ''}">Default Spots</button>
        </div>` : ''}
    </div>`;
}

async function setViewMode(mode) {
  viewMode = mode;
  renderUserBar();
  await loadSpots();
}

// ── Load Spots ────────────────────
async function loadSpots() {
  try {
    const source = viewMode === 'defaults' ? 'defaults' : 'mine';
    const res = await fetch(`/api/spots?source=${source}`);
    spots = await res.json();
    renderSpots();
  } catch (err) {
    console.error(err);
    toast('Failed to load spots', true);
  }
}

// ── Render Spots ──────────────────
function renderSpots() {
  const list = $('#spot-list');
  if (spots.length === 0) {
    if (viewMode === 'mine') {
      if (!currentUser?.email) {
        list.innerHTML = `<div class="empty-state">
          <div class="emoji">🔒</div>
          <p>Log in to manage your personal spots.</p>
        </div>`;
      } else {
        list.innerHTML = `<div class="empty-state">
          <div class="emoji">🪁</div>
          <p>You don’t have any personal spots yet.</p>
          <button class="btn btn-save" style="margin:.75rem auto;display:block;" onclick="copyDefaults(this)">📋 Copy default spots to get started</button>
          <p style="font-size:.75rem;color:var(--text-muted);margin-top:.5rem;">Or add a spot manually with the button above.</p>
        </div>`;
      }
    } else {
      list.innerHTML = '<div class="empty-state"><div class="emoji">🪁</div><p>No default spots yet.</p></div>';
    }
    return;
  }

  let html = '';
  spots.forEach(s => {
    const cams = Array.isArray(s.webcams) ? s.webcams : [];
    const camCount = cams.length;
    const camBadge = camCount > 0 ? ` <span style="font-size:.7rem;color:var(--text-muted);">📹 ${camCount} cam${camCount > 1 ? 's' : ''}</span>` : '';
    const slugBadge = s.short_slug
      ? ` <a href="/${encodeURIComponent(s.short_slug)}" target="_blank" style="font-size:.72rem;color:var(--accent);text-decoration:none;">🔗 /${esc(s.short_slug)}</a>`
      : '';
    html += `<div class="spot-card" data-id="${s.id}">
      <div class="spot-info">
        <div class="spot-name">${esc(s.name)}${camBadge}${slugBadge}</div>
        <div class="spot-coords">${s.lat.toFixed(4)}°, ${s.lon.toFixed(4)}°</div>
      </div>
      <div class="spot-actions">
        <button class="btn btn-edit" onclick="editSpot('${s.id}')">Edit</button>
        <button class="btn btn-delete" onclick="deleteSpot('${s.id}', '${esc(s.name)}')">Delete</button>
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

// ── Show / Hide Form ──────────────────
function showForm(spot = null) {
  $('#spot-form').style.display = 'block';
  $('#form-title').textContent = spot ? 'Edit Spot' : 'Add New Spot';
  $('#spot-name').value = spot ? spot.name : '';
  $('#spot-short-slug').value = spot && spot.short_slug ? spot.short_slug : '';
  $('#spot-lat').value = spot ? spot.lat : '';
  $('#spot-lon').value = spot ? spot.lon : '';
  $('#edit-id').value = spot ? spot.id : '';
  $('#geo-input').value = '';

  // Webcam fields
  const wcContainer = $('#webcam-fields');
  wcContainer.innerHTML = '';
  if (spot && spot.webcams) {
    const cams = Array.isArray(spot.webcams) ? spot.webcams : JSON.parse(spot.webcams);
    cams.forEach(cam => {
      if (cam.twitch) addWebcamField('twitch', cam.twitch, cam.label);
      else addWebcamField('ozolio', cam.oid || '', cam.label);
    });
  }

  setTimeout(() => spot ? $('#spot-name').focus() : $('#geo-input').focus(), 100);
}

function hideForm() {
  $('#spot-form').style.display = 'none';
  $('#spot-short-slug').value = '';
  $('#edit-id').value = '';
  $('#webcam-fields').innerHTML = '';
}

// ── Webcam Fields ─────────────────────
function addWebcamField(type = 'ozolio', value = '', label = '') {
  const container = $('#webcam-fields');
  const row = document.createElement('div');
  row.className = 'form-row webcam-row';
  row.innerHTML = `
    <div class="form-group" style="flex:0 0 100px">
      <label>Type</label>
      <select class="cam-type" style="padding:0.5rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);">
        <option value="ozolio" ${type === 'ozolio' ? 'selected' : ''}>Ozolio</option>
        <option value="twitch" ${type === 'twitch' ? 'selected' : ''}>Twitch</option>
      </select>
    </div>
    <div class="form-group" style="flex:2">
      <label>${type === 'twitch' ? 'Channel' : 'OID'}</label>
      <input type="text" class="cam-value" value="${esc(value)}" placeholder="${type === 'twitch' ? 'villaesencia' : 'EMB_CSDO000005A2'}">
    </div>
    <div class="form-group">
      <label>Label</label>
      <input type="text" class="cam-label" value="${esc(label)}" placeholder="Main Camera">
    </div>
    <button class="btn btn-delete" type="button" style="align-self:flex-end;margin-bottom:0.8rem;" onclick="this.closest('.webcam-row').remove()">✕</button>
  `;
  // Update label/placeholder when type changes
  row.querySelector('.cam-type').addEventListener('change', function() {
    const lbl = row.querySelector('.cam-value').previousElementSibling || row.querySelector('.form-group:nth-child(2) label');
    const inp = row.querySelector('.cam-value');
    if (this.value === 'twitch') {
      lbl.textContent = 'Channel';
      inp.placeholder = 'villaesencia';
    } else {
      lbl.textContent = 'OID';
      inp.placeholder = 'EMB_CSDO000005A2';
    }
  });
  container.appendChild(row);
}

// ── Copy Defaults ───────────────────
async function copyDefaults(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Copying…'; }
  try {
    const res = await fetch('/api/spots/copy-defaults', { method: 'POST' });
    if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Failed'); }
    toast('Default spots copied to your account!');
    loadSpots();
  } catch (e) {
    toast(e.message || 'Copy failed', true);
    if (btn) { btn.disabled = false; btn.textContent = '📋 Copy default spots to get started'; }
  }
}

// ── Map Picker ────────────────────────
let mapInstance = null;
let mapMarker = null;
let pendingMapName = '';

async function geoLookup() {
  const q = $('#geo-input').value.trim();
  if (!q) { toast('Enter a location to search', true); return; }
  const btn = $('#btn-geo');
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    const results = await geocodeQuery(q);
    if (!results || results.length === 0) {
      toast('No results found — try a different name or open the map to click manually', true);
      openMapModal(null, q);
      return;
    }
    const first = results[0];
    openMapModal({ lat: first.lat, lon: first.lon, name: first.name }, q, results);
  } catch (err) {
    toast('Geocode lookup failed', true);
    openMapModal(null, q);
  } finally {
    btn.disabled = false;
    btn.textContent = '🗺 Pick on Map';
  }
}

async function geocodeQuery(q) {
  const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
  if (!res.ok) throw new Error('Geocode request failed');
  return await res.json(); // array of { name, lat, lon }
}

function openMapModal(center, searchQuery = '', results = []) {
  const modal = $('#map-modal');
  modal.style.display = 'flex';
  $('#map-search-input').value = searchQuery;
  $('#map-search-results').style.display = 'none';
  $('#map-search-results').innerHTML = '';

  // Default center: Gulf Coast / SE US if nothing found
  const lat = center ? center.lat : 30.5;
  const lon = center ? center.lon : -87.5;
  const zoom = center ? 12 : 5;
  pendingMapName = center ? center.name : '';

  if (!mapInstance) {
    mapInstance = L.map('map-container').setView([lat, lon], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(mapInstance);

    mapMarker = L.marker([lat, lon], { draggable: true }).addTo(mapInstance);
    mapMarker.on('dragend', () => updateMapCoords(mapMarker.getLatLng()));
    mapInstance.on('click', e => {
      mapMarker.setLatLng(e.latlng);
      updateMapCoords(e.latlng);
    });
  } else {
    mapInstance.setView([lat, lon], zoom);
    mapMarker.setLatLng([lat, lon]);
  }

  updateMapCoords({ lat, lng: lon });
  if (center) { pendingMapName = center.name; }

  // Show dropdown of alternate results if multiple
  if (results.length > 1) renderMapSearchResults(results);

  // Force Leaflet to recalculate size after modal is visible
  setTimeout(() => mapInstance.invalidateSize(), 50);
}

function updateMapCoords({ lat, lng }) {
  const latR = Math.round(lat * 1000000) / 1000000;
  const lonR = Math.round(lng * 1000000) / 1000000;
  $('#map-lat-display').textContent = latR.toFixed(6) + '°';
  $('#map-lon-display').textContent = lonR.toFixed(6) + '°';
  $('#map-use-btn').disabled = false;
  $('#map-use-btn').dataset.lat = latR;
  $('#map-use-btn').dataset.lon = lonR;
}

function closeMapModal() {
  $('#map-modal').style.display = 'none';
  $('#map-search-results').style.display = 'none';
}

function renderMapSearchResults(results) {
  const container = $('#map-search-results');
  container.style.display = 'block';
  container.innerHTML = results.map((r, i) =>
    `<div class="geo-item" onclick="jumpMapTo(${r.lat},${r.lon},'${esc(r.name)}',${ i===0 ? 'true' : 'false'})">` +
      `<div>${esc(r.name)}</div>` +
      `<div class="geo-coords">${r.lat.toFixed(4)}°, ${r.lon.toFixed(4)}°</div>` +
    `</div>`
  ).join('');
}

function jumpMapTo(lat, lon, name, hideResults = false) {
  mapInstance.setView([lat, lon], 13);
  mapMarker.setLatLng([lat, lon]);
  updateMapCoords({ lat, lng: lon });
  pendingMapName = name;
  if (hideResults) {
    $('#map-search-results').style.display = 'none';
  }
}

// In-modal search
async function mapSearch() {
  const q = $('#map-search-input').value.trim();
  if (!q) return;
  const btn = $('#map-search-btn');
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const results = await geocodeQuery(q);
    if (!results || results.length === 0) {
      toast('No results found', true);
      return;
    }
    renderMapSearchResults(results);
    // Jump to first result
    jumpMapTo(results[0].lat, results[0].lon, results[0].name);
  } catch (e) {
    toast('Search failed', true);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍';
  }
}

// Bind map modal events
document.addEventListener('DOMContentLoaded', () => {
  $('#map-close').addEventListener('click', closeMapModal);
  $('#map-use-btn').addEventListener('click', () => {
    const lat = parseFloat($('#map-use-btn').dataset.lat);
    const lon = parseFloat($('#map-use-btn').dataset.lon);
    if (!isNaN(lat) && !isNaN(lon)) {
      $('#spot-lat').value = lat;
      $('#spot-lon').value = lon;
      // Pre-fill name only if blank
      if (!$('#spot-name').value.trim() && pendingMapName) {
        $('#spot-name').value = pendingMapName;
      }
      closeMapModal();
      $('#spot-name').focus();
    }
  });
  $('#map-search-btn').addEventListener('click', mapSearch);
  $('#map-search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); mapSearch(); }
  });
  // Close modal on backdrop click
  $('#map-modal').addEventListener('click', e => {
    if (e.target === $('#map-modal')) closeMapModal();
  });
});

// ── Save Spot ─────────────────────────
async function saveSpot() {
  const name = $('#spot-name').value.trim();
  const shortSlugRaw = $('#spot-short-slug').value.trim();
  const shortSlug = shortSlugRaw.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  const lat = parseFloat($('#spot-lat').value);
  const lon = parseFloat($('#spot-lon').value);
  const editId = $('#edit-id').value;

  if (!name || isNaN(lat) || isNaN(lon)) {
    toast('Please fill in name, latitude, and longitude', true);
    return;
  }
  if (shortSlug && !/^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])?$/.test(shortSlug)) {
    toast('Short name must be 3-32 chars: a-z, 0-9, hyphen', true);
    return;
  }

  // Gather webcams
  const webcams = [];
  $$('.webcam-row').forEach(row => {
    const type = row.querySelector('.cam-type').value;
    const value = row.querySelector('.cam-value').value.trim();
    const label = row.querySelector('.cam-label').value.trim();
    if (!value) return;
    if (type === 'twitch') webcams.push({ twitch: value, label: label || 'Camera' });
    else webcams.push({ oid: value, label: label || 'Camera' });
  });

  const body = { name, lat, lon, webcams, short_slug: shortSlug || null, is_default: viewMode === 'defaults' };

  try {
    let res;
    if (editId) {
      res = await fetch(`/api/spots/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } else {
      res = await fetch('/api/spots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || 'Save failed');
    }
    toast(editId ? 'Spot updated!' : 'Spot added!');
    hideForm();
    loadSpots();
  } catch (err) {
    toast(err.message || 'Failed to save spot', true);
  }
}

// ── Edit Spot ─────────────────────────
function editSpot(id) {
  const spot = spots.find(s => s.id === id);
  if (spot) showForm(spot);
}

// ── Delete Spot ───────────────────────
async function deleteSpot(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

  try {
    const res = await fetch(`/api/spots/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    toast('Spot deleted');
    loadSpots();
  } catch (err) {
    toast('Failed to delete spot', true);
  }
}

// ── Helpers ───────────────────────────
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
