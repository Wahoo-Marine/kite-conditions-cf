<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪁 Spot Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    body.share-mode nav,
    body.share-mode .back-link,
    body.share-mode .range-picker {
      display: none !important;
    }

    body.share-mode header .subtitle {
      display: none !important;
    }
  </style>
</head>
<body>

<header>
  <h1>🪁 Kite Conditions</h1>
  <div class="subtitle">Wind forecasts for your favorite spots</div>
</header>

<nav>
  <a href="/">Dashboard</a>
  <a href="/settings">Settings</a>
</nav>

<div id="loading-overlay">
  <div style="width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;"></div>
  <div style="margin-top:1rem;color:var(--text-muted);font-size:.85rem;">Loading spot data…</div>
</div>

<div class="container narrow" id="app" style="display:none;">
  <a href="/" class="back-link">← Back to Dashboard</a>

  <!-- Hero -->
  <div class="spot-hero" id="spot-hero"></div>

  <!-- Webcams -->
  <div class="webcams-section" id="webcams-section" style="display:none;"></div>

  <!-- Live Wind Station -->
  <div class="wind-station-section" id="wind-station-section" style="display:none;">
    <div class="wind-station-header">🌬️ Live Wind — Weather Station</div>
    <div class="wind-station-content">
      <div class="wind-live-panel" id="wind-live-panel">
        <div class="wind-live-loading">Loading live wind data…</div>
      </div>
      <div class="wind-chart-wrap">
        <canvas id="wind-chart" width="800" height="220"></canvas>
        <div class="wind-chart-label" id="wind-chart-label">Wind history loading…</div>
      </div>
    </div>
  </div>

  <!-- Range Picker -->
  <div class="range-picker" id="range-picker">
    <span class="range-label">Days:</span>
    <button class="range-btn" data-days="3">3 d</button>
    <button class="range-btn" data-days="5">5 d</button>
    <button class="range-btn active" data-days="7">7 d</button>
    <button class="range-btn" data-days="10">10 d</button>
    <button class="range-btn" data-days="14">14 d</button>
    <div class="range-offset">
      <label for="offset-sel">Start:</label>
      <select id="offset-sel">
        <option value="0">Today</option>
        <option value="1">Tomorrow</option>
        <option value="2">+2 days</option>
        <option value="3">+3 days</option>
        <option value="5">+5 days</option>
        <option value="7">+7 days</option>
      </select>
    </div>
  </div>

  <!-- Day Tabs + Panels -->
  <div class="day-tabs" id="day-tabs"></div>
  <div id="day-panels"></div>
</div>

<footer>
  Powered by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> •
  Data refreshes every 15 min
</footer>

<script src="/spot.js"></script>
</body>
</html>
